name: Build desktop GUI download

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - work

jobs:
  package-windows-launcher:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Create downloadable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = 'discord-utility-bot-desktop-gui'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          $exclude = @('.git', '.github', 'dist', $package, 'logs', 'exports')
          Get-ChildItem -Force | Where-Object { $exclude -notcontains $_.Name } | ForEach-Object {
            Copy-Item $_.FullName -Destination $package -Recurse -Force
          }
          Compress-Archive -Path $package -DestinationPath "dist/$package.zip" -Force

      - name: Upload desktop GUI zip
        uses: actions/upload-artifact@v4
        with:
          name: discord-utility-bot-desktop-gui
          path: dist/discord-utility-bot-desktop-gui.zip
