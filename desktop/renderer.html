<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discord Utility Bot Control Center</title>
  <link rel="stylesheet" href="renderer.css">
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div>
        <p class="eyebrow">Desktop GUI</p>
        <h1>Discord Utility Bot Control Center</h1>
        <p>Configure credentials, install dependencies, deploy slash commands, and run the bot from your PC.</p>
      </div>
      <div class="status-card">
        <span>Bot: <strong id="botStatus">stopped</strong></span>
        <span>Dashboard: <strong id="dashboardStatus">stopped</strong></span>
      </div>
    </section>

    <section class="panel grid">
      <label>Discord token <input id="DISCORD_TOKEN" type="password" placeholder="Bot token"></label>
      <label>Client ID <input id="CLIENT_ID" placeholder="Application client ID"></label>
      <label>Guild IDs <input id="GUILD_IDS" placeholder="123,456"></label>
      <label>MongoDB URI <input id="MONGODB_URI" placeholder="mongodb+srv://..."></label>
      <label>Dashboard password <input id="DASHBOARD_PASSWORD" type="password" placeholder="Choose a password"></label>
      <label>Dashboard port <input id="WEB_DASHBOARD_PORT" placeholder="3000"></label>
      <label>Command role ID <input id="COMMAND_ROLE_ID" placeholder="Optional"></label>
      <label>Bot owner ID <input id="BOT_OWNER_ID" placeholder="Optional"></label>
    </section>

    <section class="actions">
      <button id="save">Save settings</button>
      <button id="install">Install dependencies</button>
      <button id="deploy">Deploy slash commands</button>
      <button id="startBot" class="primary">Start bot</button>
      <button id="stopBot">Stop bot</button>
      <button id="startDashboard">Start dashboard</button>
      <button id="stopDashboard">Stop dashboard</button>
      <button id="openDashboard">Open dashboard</button>
    </section>

    <section class="panel">
      <div class="panel-heading">
        <h2>Live logs</h2>
        <small>Install, deploy, bot, and dashboard output appears here.</small>
      </div>
      <pre id="logs"></pre>
    </section>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
